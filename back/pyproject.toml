[project]
name = "portfolio-api"
version = "0.1.0"
description = "Portfolio backend: RAG chatbot that only answers about Laura's profile (model-agnostic)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
]

[project.optional-dependencies]
# Production providers — install only what you use: `uv sync --extra openai`
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Ollama (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is more readable for word lists

[tool.ruff.lint.per-file-ignores]
# Prompt templates are prose: wrapping them would change the prompt.
"app/rag/prompts.py" = ["E501"]
